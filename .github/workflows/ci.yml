name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify committed dependency lock
        run: |
          python -m pip install "uv==0.11.29"
          uv lock --check

  lint:
    needs: lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.11.29"
          uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run --no-sync ruff check src/ tests/ --output-format=github
      - name: Ruff format check
        run: uv run --no-sync ruff format --check src/ tests/

  type-check:
    needs: lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.11.29"
          uv sync --locked --extra dev
      - name: Mypy
        run: uv run --no-sync mypy src/ --ignore-missing-imports

  test:
    needs: lock
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.11.29"
          uv sync --locked --extra dev --python "${{ matrix.python-version }}"
      - name: Run tests with coverage
        run: |
          uv run --no-sync pytest tests/ -m "not integration and not e2e" --timeout=120 --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    needs: lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.11.29"
          uv sync --locked --extra dev
      - name: Run PostgreSQL and Docker Compose integration tests
        run: |
          uv run --no-sync pytest \
            tests/test_database_integration.py \
            tests/test_docker_compose_integration.py \
            tests/test_production_compose_integration.py \
            -m integration -v --timeout=600

  e2e:
    needs: lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.11.29"
          uv sync --locked --extra dev
      - name: Install Playwright browsers
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Run E2E tests
        run: |
          uv run --no-sync pytest tests/e2e/ -m e2e -v --timeout=60

  lighthouse:
    needs: lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.11.29"
          uv sync --locked --extra dev
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x
      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}

  sonarcloud:
    needs: test
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io

  security:
    needs: lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.11.29"
          uv sync --locked --extra dev
      - name: Export exact locked dependency set
        run: |
          uv export --quiet --locked --all-extras --no-hashes --no-emit-project \
            --output-file "$RUNNER_TEMP/audit-requirements.txt"
      - name: pip-audit (known CVEs in locked dependencies)
        run: |
          uv run --no-sync pip-audit \
            --requirement "$RUNNER_TEMP/audit-requirements.txt" --strict --desc on
      - name: Bandit SAST scan
        run: uv run --no-sync bandit -r src/ -ll -q -f json -o bandit-report.json
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Build Docker image for scanning
        run: docker build -t net-sentry:ci .
      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: net-sentry:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  package:
    needs: lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install "uv==0.11.29"
          uv sync --locked --extra dev
          uv run --no-sync python -m build
      - name: Install and smoke-test the wheel
        run: |
          pip install --force-reinstall dist/*.whl
          python -I -c "from importlib.resources import files; assert (files('src') / 'templates' / 'login.html').is_file(); assert (files('src') / 'migrations' / 'env.py').is_file()"
          net-sentry --help

  zap-baseline:
    needs: lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install "uv==0.11.29"
          uv sync --locked --extra dev
      - name: Start API server
        run: |
          uv run --no-sync uvicorn src.api:app --host 0.0.0.0 --port 8000 &
          sleep 5
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8000"
          rules_file_name: ""
          cmd_options: "-I"
