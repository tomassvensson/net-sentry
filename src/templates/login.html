<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to the Net Sentry device-tracking dashboard.">
    <title>Sign in — Net Sentry</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            color-scheme: dark;
            --bg: #101526;
            --surface: #18213a;
            --border: #2c3858;
            --primary: #2d6cdf;
            --primary-hover: #3e7bea;
            --text: #f3f5fb;
            --text-dim: #a8b0c3;
            --danger: #ff7188;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background:
                radial-gradient(circle at 20% 10%, rgba(45, 108, 223, 0.2), transparent 32rem),
                var(--bg);
            color: var(--text);
        }
        main {
            width: min(100%, 420px);
            padding: 2rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
        }
        h1 { margin: 0 0 0.4rem; font-size: 1.65rem; }
        .subtitle { margin: 0 0 1.6rem; color: var(--text-dim); line-height: 1.5; }
        label { display: block; margin: 0 0 0.4rem; font-size: 0.85rem; font-weight: 600; }
        input {
            width: 100%;
            margin: 0 0 1rem;
            padding: 0.72rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
        }
        input:focus {
            outline: 2px solid rgba(45, 108, 223, 0.5);
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 0.72rem 1rem;
            border: 0;
            border-radius: 6px;
            background: var(--primary);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: var(--primary-hover); }
        .error {
            margin: 0 0 1rem;
            padding: 0.7rem 0.8rem;
            border: 1px solid rgba(255, 113, 136, 0.45);
            border-radius: 6px;
            background: rgba(255, 113, 136, 0.1);
            color: var(--danger);
            font-size: 0.9rem;
        }
        .security-note {
            margin: 1.25rem 0 0;
            color: var(--text-dim);
            font-size: 0.78rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
<main>
    <h1>Net Sentry</h1>
    <p class="subtitle">Sign in to view device visibility and network observations.</p>
    {% if error %}
    <p class="error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" maxlength="128"
               autocomplete="username" autofocus required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" maxlength="1024"
               autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
    <p class="security-note">Sessions are stored in an HttpOnly, same-site cookie and expire automatically.</p>
</main>
</body>
</html>
