# GitLab CI mirror of .github/workflows/ci.yml.
#
# GitLab is the proving ground: scripts/push-via-gitlab.sh pushes here first and only
# pushes to GitHub once this pipeline is green. Keep the jobs in step with ci.yml.
#
# Job map (GitHub -> GitLab):
#   lint        -> lint
#   type-check  -> type-check
#   test        -> test:linux [3.10, 3.12, 3.13] + test:windows [3.10, 3.12, 3.13]
#   security    -> security (pip audit) + trivy
#   sonarcloud  -> not mirrored (needs SONAR_TOKEN; GitHub-only)
#   codeql      -> not mirrored (GitHub-only)

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

stages:
  - check

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.python:
  stage: check
  image: python:3.13
  interruptible: true
  cache:
    key: pip-$CI_JOB_NAME_SLUG
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"

lint:
  extends: .python
  script:
    - ruff check src/ tests/
    - ruff format --check src/ tests/

type-check:
  extends: .python
  script:
    - pip install types-tabulate
    - mypy src/ --ignore-missing-imports

test:linux:
  extends: .python
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.12", "3.13"]
  script:
    - pip install types-tabulate
    - pytest tests/ --timeout=120 --cov=src --cov-report=xml --cov-report=term-missing
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# GitLab.com hosted Windows runner (PowerShell). Takes ~8 min per job.
# Python is installed with uv because the runner image ships none.
# Skip with: scripts/push-via-gitlab.sh --no-windows
test:windows:
  stage: check
  interruptible: true
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: $SKIP_WINDOWS == "1"
      when: never
    - when: on_success
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.12", "3.13"]
  script:
    - irm https://astral.sh/uv/install.ps1 | iex
    - $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
    - uv python install $env:PYTHON_VERSION
    - uv venv --seed --python $env:PYTHON_VERSION .venv
    - $env:Path = "$env:CI_PROJECT_DIR\.venv\Scripts;$env:Path"
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - pip install types-tabulate
    - pytest tests/ --timeout=120 --cov=src --cov-report=xml --cov-report=term-missing

security:
  extends: .python
  script:
    - pip audit || true

trivy:
  stage: check
  interruptible: true
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  allow_failure: true
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 0 .
