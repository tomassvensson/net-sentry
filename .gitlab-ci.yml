# GitLab CI mirror of .github/workflows/ci.yml.
#
# GitLab is the proving ground: scripts/push-via-gitlab.sh pushes here first and only
# pushes to GitHub once this pipeline is green. Keep the jobs in step with ci.yml.
#
# Job map (GitHub -> GitLab):
#   lint          -> lint
#   type-check    -> type-check
#   test          -> test:linux + test:windows (Python 3.13, like the GitHub matrix)
#   security      -> security (pip-audit, bandit) + trivy (filesystem scan)
#   integration   -> not mirrored (needs Docker; continue-on-error on GitHub)
#   e2e           -> not mirrored (Playwright; continue-on-error on GitHub)
#   lighthouse    -> not mirrored (Node/LHCI; continue-on-error on GitHub)
#   zap-baseline  -> not mirrored (continue-on-error on GitHub)
#   sonarcloud    -> not mirrored (needs SONAR_TOKEN; GitHub-only)

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

stages:
  - check

variables:
  PYTHON_VERSION: "3.13"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.python:
  stage: check
  image: python:${PYTHON_VERSION}
  interruptible: true
  cache:
    key: pip-$CI_JOB_NAME_SLUG
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"

lint:
  extends: .python
  script:
    - ruff check src/ tests/
    - ruff format --check src/ tests/

type-check:
  extends: .python
  script:
    - pip install types-tabulate
    - mypy src/ --ignore-missing-imports

test:linux:
  extends: .python
  script:
    - pip install types-tabulate
    - pytest tests/ -m "not integration" --timeout=120 --cov=src --cov-report=xml --cov-report=term-missing
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# GitLab.com hosted Windows runner (PowerShell). Takes ~8 min.
# Python is installed with uv because the runner image ships none.
# Skip with: scripts/push-via-gitlab.sh --no-windows
test:windows:
  stage: check
  interruptible: true
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: $SKIP_WINDOWS == "1"
      when: never
    - when: on_success
  script:
    - irm https://astral.sh/uv/install.ps1 | iex
    - $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
    - uv python install $env:PYTHON_VERSION
    - uv venv --seed --python $env:PYTHON_VERSION .venv
    - $env:Path = "$env:CI_PROJECT_DIR\.venv\Scripts;$env:Path"
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - pip install types-tabulate
    - pytest tests/ -m "not integration" --timeout=120 --cov=src --cov-report=xml --cov-report=term-missing

security:
  extends: .python
  script:
    - pip install pip-audit
    - pip-audit --strict --desc on 2>&1 || true
    - bandit -r src/ -ll -q -f json -o bandit-report.json 2>&1 || true
    - bandit -r src/ -ll -q 2>&1 || true
  artifacts:
    when: always
    paths:
      - bandit-report.json

trivy:
  stage: check
  interruptible: true
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  allow_failure: true
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 0 .
